name: Library test suites (test.lib)

# Runs the test suites written in the Singular language with the
# test.lib testing library (Tst/libtests/*.sng).  This is the
# pipeline for the gradual migration of the shipped libraries to
# own test suites: each library gains *.sng files over time, and
# this workflow picks them up automatically.
# The runner produces a JUnit-style XML report (libtests-junit.xml)
# which is uploaded as an artifact and used for test reporting.
on: [push, pull_request]

env:
  prefix: "/tmp/prefix"

jobs:
  libtests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y jq \
              sharutils libgmp-dev libreadline-dev libmpfr-dev libntl-dev libcdd-dev \
              4ti2 normaliz libopenblas-dev libflint-dev \
              cmake lrcalc
          # NOTE: lrcalc is needed by Tst/libtests/lrcalc.lib.test.sng; it
          # provides the external programs lrcalc and schubmult used by
          # Singular/LIB/lrcalc.lib.  There is no Homebrew formula, so the
          # macOS leg skips that suite (see the SKIP: convention in
          # Tst/libtests/README.md).
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install autoconf automake libtool gmp readline mpfr ntl cddlib flint jq
          else
            echo "$RUNNER_OS not supported"
            exit 1
          fi

      - run: ./autogen.sh
      - run: ./configure --prefix=$prefix --with-ntl --with-flint
      - run: make -j3
      - run: make install

      - name: Run library test suites
        if: ${{ always() }}
        run: ./Tst/libtests/libtests.cmd -s $prefix/bin/Singular

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: libtests-reports-${{ matrix.os }}
          path: |
            libtests-junit.xml
            libtests-ctrf.json
            libtests.*/**/*.json
            libtests.*/**/*.log
          if-no-files-found: ignore
          retention-days: 14

      # NOTE: a PR-comment step for the CTRF report was removed here:
      # the referenced action (ctrf-io/ctrf-action) does not exist,
      # which made the whole workflow fail at "Prepare all required
      # actions" before any step could run.  The CTRF JSON is still
      # uploaded as an artifact above, and the JUnit report below
      # provides the GitHub-native test summary and annotations.
      - name: Publish test summary (JUnit)
        if: ${{ always() }}
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: libtests-junit.xml
          check_name: libtests (${{ matrix.os }})
          # fail the step if the report contains no tests at all
          # (guards against a silently missing or empty report file)
          require_tests: true
          detailed_summary: true
